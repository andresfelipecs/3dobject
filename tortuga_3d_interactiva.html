<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tortuga 3D — Visor Interactivo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#0a0f0d; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  #info {
    position:absolute; top:18px; left:50%; transform:translateX(-50%);
    background:rgba(10,20,14,0.82); color:#8fcfa0; font-family:monospace;
    font-size:13px; padding:10px 20px; border-radius:8px;
    border:1px solid #1e3d28; pointer-events:none; text-align:center;
  }
  #legend {
    position:absolute; bottom:18px; right:18px;
    background:rgba(10,20,14,0.82); color:#8fcfa0; font-family:monospace;
    font-size:12px; padding:10px 16px; border-radius:8px;
    border:1px solid #1e3d28; pointer-events:none; line-height:1.9;
  }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">Tortuga 3D equilibrada &nbsp;|&nbsp; Arrastra para rotar &nbsp;·&nbsp; Scroll para zoom</div>
<div id="legend">
  <span class="dot" style="background:#246b3a"></span>Caparazón<br>
  <span class="dot" style="background:#3aaa60"></span>Cuello / Cola<br>
  <span class="dot" style="background:#45b86a"></span>Cabeza<br>
  <span class="dot" style="background:#2d9050"></span>Aletas / Patas<br>
  <span class="dot" style="background:#f0a020"></span>Ápex de contacto<br>
  <span class="dot" style="background:#4af070"></span>Centro de masa<br>
  <hr style="border-color:#1e3d28; margin:6px 0;">
  <span style="color:#6ab08a">z_CM = 11.0 mm &nbsp;|&nbsp; R_eff = 44 mm</span><br>
  <span style="color:#6ab08a">Offset XY ≈ 1.4 mm &nbsp;|&nbsp; Estable ✓</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x0a0f0d, 1);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 800);
  camera.up.set(0, 0, 1);

  scene.add(new THREE.AmbientLight(0xffffff, 0.50));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(50, -80, 120); scene.add(sun);
  const fill = new THREE.DirectionalLight(0x80ffcc, 0.20);
  fill.position.set(-80, 60, 30); scene.add(fill);

  const S = 11;
  const mShell = new THREE.MeshPhongMaterial({ color:0x246b3a, shininess:80 });
  const mBody  = new THREE.MeshPhongMaterial({ color:0x3aaa60, shininess:40 });
  const mLimb  = new THREE.MeshPhongMaterial({ color:0x2d9050, shininess:25 });
  const mHead  = new THREE.MeshPhongMaterial({ color:0x45b86a, shininess:35 });

  function ellipsoid(cx,cy,cz,ax,ay,az,mat) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(1,48,32), mat);
    m.scale.set(ax*S,ay*S,az*S); m.position.set(cx*S,cy*S,cz*S);
    scene.add(m); return m;
  }
  function capsule(p0,p1,r,mat) {
    const a=new THREE.Vector3(...p0.map(v=>v*S)), b=new THREE.Vector3(...p1.map(v=>v*S));
    const rS=r*S, dir=b.clone().sub(a), len=dir.length(), mid=a.clone().add(b).multiplyScalar(0.5);
    const cyl=new THREE.Mesh(new THREE.CylinderGeometry(rS,rS,len,20,1,false),mat);
    cyl.position.copy(mid); cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
    scene.add(cyl);
    [a,b].forEach(pt=>{ const sp=new THREE.Mesh(new THREE.SphereGeometry(rS,16,12),mat); sp.position.copy(pt); scene.add(sp); });
  }
  function cylinder(p0,p1,r,mat) {
    const a=new THREE.Vector3(...p0.map(v=>v*S)), b=new THREE.Vector3(...p1.map(v=>v*S));
    const rS=r*S, dir=b.clone().sub(a), len=dir.length(), mid=a.clone().add(b).multiplyScalar(0.5);
    const cyl=new THREE.Mesh(new THREE.CylinderGeometry(rS,rS,len,20,1,false),mat);
    cyl.position.copy(mid); cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
    scene.add(cyl);
  }

  // ── GEOMETRÍA (congruente con STL de impresión y HTML de documentación) ──
  ellipsoid(-2.40,0,1.05, 1.95,1.90,0.95, mShell);
  ellipsoid(-2.42,0,1.08, 1.46,1.43,0.60,
    new THREE.MeshPhongMaterial({color:0x0d1a10,shininess:5,side:THREE.BackSide,transparent:true,opacity:0.70}));
  capsule([-1.55,0,0.72],[-0.55,0,0.50],0.22,mBody);
  ellipsoid(-0.26,0,0.44, 0.56,0.38,0.30, mHead);
  capsule([-0.08,0,0.26],[0.04,0,0.28],0.09,mHead);
  cylinder([-1.80, 0.60,0.90],[0.60, 2.20,0.85],0.16,mLimb);
  cylinder([-1.80,-0.60,0.90],[0.60,-2.20,0.85],0.16,mLimb);
  cylinder([-3.10, 0.90,0.85],[-4.60, 1.80,0.75],0.13,mLimb);
  cylinder([-3.10,-0.90,0.85],[-4.60,-1.80,0.75],0.13,mLimb);
  capsule([-4.10,0,0.68],[-5.30,0,0.60],0.08,mBody);

  // ── Plano de mesa y ápex ──
  const Z_CONTACT = (1.05-0.95)*S;
  const gPlane=new THREE.PlaneGeometry(160,130);
  const mPlane=new THREE.MeshBasicMaterial({color:0x4ab464,transparent:true,opacity:0.05,side:THREE.DoubleSide});
  const plane=new THREE.Mesh(gPlane,mPlane);
  plane.position.set(-2.40*S,0,Z_CONTACT); scene.add(plane);
  const grid=new THREE.GridHelper(160,12,0x4ab464,0x1a3a20);
  grid.rotation.x=Math.PI/2; grid.position.set(-2.40*S,0,Z_CONTACT-0.3);
  grid.material.transparent=true; grid.material.opacity=0.12; scene.add(grid);

  const apexPos=new THREE.Vector3(-2.40*S,0,Z_CONTACT);
  const apexMesh=new THREE.Mesh(new THREE.SphereGeometry(2.8,18,14),new THREE.MeshBasicMaterial({color:0xf0a020}));
  apexMesh.position.copy(apexPos); scene.add(apexMesh);
  const ringMat=new THREE.MeshBasicMaterial({color:0xf0a020,transparent:true,opacity:0.5});
  const ring=new THREE.Mesh(new THREE.TorusGeometry(5.5,0.7,8,40),ringMat);
  ring.position.copy(apexPos); ring.rotation.x=Math.PI/2; scene.add(ring);

  const Z_CM=11.0;
  const cmPos=new THREE.Vector3(-2.40*S,0,Z_CM);
  const cmMesh=new THREE.Mesh(new THREE.SphereGeometry(3.2,18,14),new THREE.MeshBasicMaterial({color:0x4af070}));
  cmMesh.position.copy(cmPos); scene.add(cmMesh);
  const axisGeo=new THREE.BufferGeometry().setFromPoints([apexPos.clone(),cmPos.clone()]);
  scene.add(new THREE.Line(axisGeo,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.28})));

  // ── Cámara y controles ──
  let theta=0.55, phi=0.82, radius=200;
  const target=new THREE.Vector3(-2.40*S,0,12);
  let isDragging=false, lastX=0, lastY=0, autoRot=true;

  function resize() {
    const w=canvas.clientWidth, h=canvas.clientHeight;
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize',resize); resize();

  function updateCam() {
    camera.position.set(
      target.x+radius*Math.sin(phi)*Math.cos(theta),
      target.y+radius*Math.sin(phi)*Math.sin(theta),
      target.z+radius*Math.cos(phi));
    camera.lookAt(target);
  }
  updateCam();

  canvas.addEventListener('mousedown',e=>{isDragging=true;autoRot=false;lastX=e.clientX;lastY=e.clientY;canvas.style.cursor='grabbing';});
  window.addEventListener('mouseup',()=>{isDragging=false;canvas.style.cursor='grab';});
  window.addEventListener('mousemove',e=>{
    if(!isDragging)return;
    theta+=(e.clientX-lastX)*0.008;
    phi=Math.max(0.08,Math.min(Math.PI-0.08,phi+(e.clientY-lastY)*0.008));
    lastX=e.clientX;lastY=e.clientY;updateCam();
  });
  canvas.addEventListener('wheel',e=>{radius=Math.max(70,Math.min(500,radius+e.deltaY*0.4));updateCam();e.preventDefault();},{passive:false});

  let lastDist=0,lastTX=0,lastTY=0,touching=false;
  canvas.addEventListener('touchstart',e=>{autoRot=false;if(e.touches.length===1){touching=true;lastTX=e.touches[0].clientX;lastTY=e.touches[0].clientY;}if(e.touches.length===2)lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);e.preventDefault();},{passive:false});
  canvas.addEventListener('touchmove',e=>{
    if(e.touches.length===1&&touching){theta+=(e.touches[0].clientX-lastTX)*0.008;phi=Math.max(0.08,Math.min(Math.PI-0.08,phi+(e.touches[0].clientY-lastTY)*0.008));lastTX=e.touches[0].clientX;lastTY=e.touches[0].clientY;updateCam();}
    if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);radius=Math.max(70,Math.min(500,radius-(d-lastDist)*0.5));lastDist=d;updateCam();}
    e.preventDefault();
  },{passive:false});
  canvas.addEventListener('touchend',()=>{touching=false;});

  function animate() {
    requestAnimationFrame(animate);
    if(autoRot){theta+=0.005;updateCam();}
    ringMat.opacity=0.35+0.22*Math.sin(Date.now()*0.0028);
    renderer.render(scene,camera);
  }
  animate();
})();
</script>
</body>
</html>
